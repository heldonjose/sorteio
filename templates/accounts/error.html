{% extends "base.html" %}

{% block title %}Erro{% endblock %}

{% block content %}
<div class="min-h-screen flex flex-col items-center justify-center px-4 py-16">
  <div class="w-full max-w-md text-center">

    <div class="w-16 h-16 mx-auto mb-6 rounded-full bg-red-100 dark:bg-red-900/30 flex items-center justify-center">
      <svg class="w-8 h-8 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
      </svg>
    </div>

    <h1 class="text-2xl font-bold mb-3">Algo deu errado</h1>
    <p class="text-gray-600 dark:text-gray-400 mb-8">
      {{ message|default:"Ocorreu um erro inesperado. Por favor, tente novamente." }}
    </p>

    <a
      href="{% url 'accounts:login' %}"
      class="inline-flex items-center gap-2 px-6 py-3 rounded-xl bg-violet-600 hover:bg-violet-700 text-white font-semibold transition-colors"
    >
      Tentar novamente
    </a>

    <div class="mt-4">
      <a href="{% url 'pages:landing' %}" class="text-sm text-gray-500 hover:text-gray-700 dark:hover:text-gray-300">
        Voltar para a página inicial
      </a>
    </div>
  </div>
</div>
{% endblock %}
