{% load static %}<!DOCTYPE html>
<html
  lang="pt-BR"
  x-data="{ darkMode: localStorage.getItem('darkMode') === 'true' }"
  x-init="$watch('darkMode', v => localStorage.setItem('darkMode', v))"
  :class="{ 'dark': darkMode }"
>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página não encontrada</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/tailwind.css' %}">
  <style>
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-16px); }
    }
    @keyframes pulse-glow {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.05); }
    }
    .float { animation: float 4s ease-in-out infinite; }
    .glow-blob { animation: pulse-glow 5s ease-in-out infinite; }
  </style>
</head>
<body class="bg-white dark:bg-gray-950 text-gray-900 dark:text-gray-100 antialiased min-h-screen transition-colors duration-200 overflow-hidden">

  <!-- Blobs decorativos de fundo -->
  <div class="fixed inset-0 pointer-events-none select-none" aria-hidden="true">
    <div class="glow-blob absolute -top-32 -left-32 w-96 h-96 rounded-full bg-violet-500/20 blur-3xl"></div>
    <div class="glow-blob absolute top-1/2 -right-32 w-80 h-80 rounded-full bg-pink-500/20 blur-3xl" style="animation-delay:1.5s"></div>
    <div class="glow-blob absolute -bottom-24 left-1/3 w-72 h-72 rounded-full bg-orange-400/15 blur-3xl" style="animation-delay:3s"></div>
  </div>

  <div class="relative min-h-screen flex flex-col items-center justify-center px-4 text-center">

    <!-- Número flutuante -->
    <div class="float mb-2 select-none">
      <p class="font-black leading-none bg-gradient-to-br from-violet-600 via-pink-500 to-orange-400 bg-clip-text text-transparent drop-shadow-sm"
         style="font-size: clamp(8rem, 20vw, 16rem)">
        404
      </p>
    </div>

    <!-- SVG decorativo — lupa -->
    <div class="mb-8 -mt-4">
      <svg class="w-16 h-16 mx-auto text-violet-400 dark:text-violet-500 opacity-70" fill="none" viewBox="0 0 64 64" stroke="currentColor" stroke-width="2">
        <circle cx="28" cy="28" r="18" stroke-dasharray="6 4"/>
        <line x1="41" y1="41" x2="56" y2="56" stroke-linecap="round" stroke-width="4"/>
        <line x1="22" y1="28" x2="34" y2="28" stroke-linecap="round"/>
        <line x1="28" y1="22" x2="28" y2="34" stroke-linecap="round"/>
      </svg>
    </div>

    <h1 class="text-3xl sm:text-4xl font-extrabold mb-3 tracking-tight">
      Página não encontrada
    </h1>
    <p class="text-gray-500 dark:text-gray-400 max-w-md text-base sm:text-lg mb-10 leading-relaxed">
      O link que você seguiu pode estar quebrado ou essa página não existe mais.
      Mas não se preocupe — você não está perdido!
    </p>

    <div class="flex flex-col sm:flex-row gap-3 items-center">
      <a href="/"
         class="inline-flex items-center gap-2 px-8 py-4 rounded-2xl bg-gradient-to-r from-violet-600 via-pink-500 to-orange-500 text-white font-bold text-base hover:opacity-90 active:scale-95 transition-all shadow-lg shadow-violet-500/25">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
        </svg>
        Ir para o início
      </a>
      <button onclick="history.back()"
              class="inline-flex items-center gap-2 px-8 py-4 rounded-2xl border border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-300 font-semibold text-base hover:bg-gray-50 dark:hover:bg-gray-800 active:scale-95 transition-all">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
        </svg>
        Voltar
      </button>
    </div>

  </div>

  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.3/dist/cdn.min.js"></script>
</body>
</html>
