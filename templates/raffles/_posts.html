{% comment %}Fragmento HTMX — grade de posts (carregar mais).{% endcomment %}
{% if error %}
  <p class="col-span-full text-center text-red-500 text-sm">{{ error }}</p>
{% elif posts %}
  {% for post in posts %}
  <label class="relative cursor-pointer group">
    <input type="radio" name="selected_post" value="{{ post.id }}"
           class="sr-only peer"
           data-id="{{ post.id }}"
           data-permalink="{{ post.permalink|default:'' }}"
           data-caption="{{ post.caption|default:''|truncatechars:200 }}"
           data-thumbnail="{{ post.thumbnail_url|default:post.media_url|default:'' }}"
           data-type="{{ post.media_type|default:'' }}">
    <div class="aspect-square rounded-xl overflow-hidden bg-gray-100 dark:bg-gray-800
                ring-2 ring-transparent peer-checked:ring-violet-500 transition-all duration-150
                group-hover:brightness-90">
      {% if post.thumbnail_url or post.media_url %}
        <img src="{{ post.thumbnail_url|default:post.media_url }}"
             alt="{{ post.caption|default:'Post'|truncatechars:60 }}"
             class="w-full h-full object-cover">
      {% else %}
        <div class="w-full h-full flex items-center justify-center text-gray-400">
          <svg class="w-10 h-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                  d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
          </svg>
        </div>
      {% endif %}
    </div>
    <div class="absolute top-2 right-2 w-5 h-5 rounded-full bg-violet-600
                opacity-0 peer-checked:opacity-100 transition-opacity flex items-center justify-center">
      <svg class="w-3 h-3 text-white" fill="currentColor" viewBox="0 0 20 20">
        <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/>
      </svg>
    </div>
    {% if post.comments_count is not None %}
    <div class="absolute bottom-2 left-2 text-xs bg-black/60 text-white px-1.5 py-0.5 rounded">
      {{ post.comments_count }} comentários
    </div>
    {% endif %}
  </label>
  {% endfor %}

  {% if after %}
  <div class="col-span-full flex justify-center mt-2">
    <button type="button"
            hx-get="{% url 'raffles:posts_fragment' %}?after={{ after }}"
            hx-target="#posts-grid"
            hx-swap="beforeend"
            class="px-4 py-2 text-sm bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 rounded-lg transition-colors">
      Carregar mais posts
    </button>
  </div>
  {% endif %}
{% else %}
  <p class="col-span-full text-center text-gray-400 text-sm py-8">
    Nenhum post encontrado nesta conta.
  </p>
{% endif %}
