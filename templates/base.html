{% load static %}<!DOCTYPE html>
<html
  lang="pt-BR"
  x-data="{ darkMode: localStorage.getItem('darkMode') === 'true' }"
  x-init="$watch('darkMode', v => localStorage.setItem('darkMode', v))"
  :class="{ 'dark': darkMode }"
>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Sorteio{% endblock %} — Sorteio Insta</title>
  <meta name="description" content="{% block description %}Plataforma de sorteios transparentes e auditáveis para o Instagram{% endblock %}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{% static 'css/tailwind.css' %}">

  {% block extra_head %}{% endblock %}
</head>

<body class="bg-white dark:bg-gray-950 text-gray-900 dark:text-gray-100 antialiased min-h-screen transition-colors duration-200">

  {% block content %}{% endblock %}

  <!-- HTMX -->
  <script src="https://unpkg.com/htmx.org@2.0.4" crossorigin="anonymous"></script>
  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.3/dist/cdn.min.js"></script>

  {% block extra_scripts %}{% endblock %}

</body>
</html>
