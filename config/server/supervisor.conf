; config/server/supervisor.conf
; Copiar para /etc/supervisor/conf.d/sorteio.conf
; Depois: supervisorctl reread && supervisorctl update

; ── Gunicorn (app Django) ────────────────────────────────────────────────────
[program:sorteio-web]
command=/srv/sorteio/venv/bin/gunicorn config.wsgi:application -c /etc/gunicorn/sorteio.conf.py
directory=/srv/sorteio
user=sorteio
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/sorteio/supervisor-web.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
environment=DJANGO_SETTINGS_MODULE="config.settings"

; ── Celery Worker ───────────────────────────────────────────────────────────
[program:sorteio-worker]
command=/srv/sorteio/venv/bin/celery -A config worker -Q sorteio -c 2 -l INFO --logfile /var/log/sorteio/celery-worker.log
directory=/srv/sorteio
user=sorteio
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/sorteio/supervisor-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=600

; ── Celery Beat (tarefas periódicas) ────────────────────────────────────────
[program:sorteio-beat]
command=/srv/sorteio/venv/bin/celery -A config beat -l INFO --scheduler django_celery_beat.schedulers:DatabaseScheduler --logfile /var/log/sorteio/celery-beat.log
directory=/srv/sorteio
user=sorteio
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/sorteio/supervisor-beat.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3

; ── Grupo ───────────────────────────────────────────────────────────────────
[group:sorteio]
programs=sorteio-web,sorteio-worker,sorteio-beat
