# config/server/nginx.conf
# Copiar para /etc/nginx/sites-available/sorteio e habilitar com:
#   ln -s /etc/nginx/sites-available/sorteio /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx

upstream sorteio_app {
    server 127.0.0.1:9093;
}

# Redirecionar HTTP → HTTPS
server {
    listen 80;
    server_name sorteio.repsys.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name sorteio.repsys.com.br;

    # Certificados (gerados pelo certbot)
    ssl_certificate     /etc/letsencrypt/live/sorteio.repsys.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sorteio.repsys.com.br/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/sorteio.repsys.com.br/chain.pem;

    # TLS moderno
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Segurança
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # Logs
    access_log /var/log/sorteio/nginx-access.log;
    error_log  /var/log/sorteio/nginx-error.log;

    # Arquivos estáticos (servidos diretamente pelo nginx)
    location /static/ {
        alias /srv/sorteio/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Media (se houver)
    location /media/ {
        alias /srv/sorteio/media/;
        expires 7d;
    }

    # Proxy para o Gunicorn
    location / {
        proxy_pass         http://sorteio_app;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        client_max_body_size 5m;
    }
}
